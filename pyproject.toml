[project]
name = "wil"
version = "0.1.0"
requires-python = "<3.15,>=3.14"
dependencies = [
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "zensical==0.1.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "pre-commit==4.7.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
exclude-newer = "1 week"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
