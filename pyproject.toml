[project]
name = "wil"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.2"]

[dependency-groups]
dev = ["zensical==0.1.3", "pytest", "ruff", "pre-commit"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
