name: weekly

# Actions タブの [Run workflow] から手動で実行する。結果は PR になる（main には直接入れない）。
on:
  workflow_dispatch:
    inputs:
      week:
        description: '対象週に含まれる日付 YYYY-MM-DD（空なら先週）'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      WEEK: ${{ inputs.week }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci

      - name: 対象週を求める
        id: week
        run: |
          read -r monday sunday < <(node scripts/week.ts "$WEEK")
          echo "monday=$monday" >> "$GITHUB_OUTPUT"
          echo "sunday=$sunday" >> "$GITHUB_OUTPUT"

      - name: 週報が既にあれば止める
        env:
          MONDAY: ${{ steps.week.outputs.monday }}
        run: |
          if [ -e "weekly/$MONDAY.md" ]; then
            echo "::error::weekly/$MONDAY.md は既にあります。作り直すなら、先にそのファイルを消してください。"
            exit 1
          fi

      - name: 日報が無ければ止める
        env:
          MONDAY: ${{ steps.week.outputs.monday }}
          SUNDAY: ${{ steps.week.outputs.sunday }}
        run: |
          n=$(ls daily 2>/dev/null | sed 's/\.md$//' | awk -v a="$MONDAY" -v b="$SUNDAY" '$0>=a && $0<=b' | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "::error::この週（$MONDAY〜$SUNDAY）の日報がありません。日報を push してから、もう一度実行してください。"
            exit 1
          fi

      - name: 週報を作る
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            .claude/skills/weekly/SKILL.md を読み、その手順に従って週報を作ってください。
            対象週は ${{ steps.week.outputs.monday }} 〜 ${{ steps.week.outputs.sunday }} です。
            手順1は `node scripts/week.ts ${{ steps.week.outputs.monday }}` として実行してください（$ARGUMENTS は ${{ steps.week.outputs.monday }} です）。
            コミットと push はしないでください。
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node scripts/week.ts:*),Bash(npm run check),Bash(ls:*)"

      - name: 週報ができたか確認する
        env:
          MONDAY: ${{ steps.week.outputs.monday }}
        run: |
          if [ ! -f "weekly/$MONDAY.md" ]; then
            echo "::error::weekly/$MONDAY.md が作られませんでした。「週報を作る」ステップのログを確認してください。"
            exit 1
          fi

      - name: PR を作る
        env:
          MONDAY: ${{ steps.week.outputs.monday }}
          SUNDAY: ${{ steps.week.outputs.sunday }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "weekly/$MONDAY"
          git add "weekly/$MONDAY.md"
          git commit -m "週報 $MONDAY〜$SUNDAY"
          git push origin "weekly/$MONDAY"
          gh pr create --base main --head "weekly/$MONDAY" \
            --title "週報 $MONDAY〜$SUNDAY" \
            --body "/weekly で自動作成した週報です。内容を確認して、直してからマージしてください。マージすると公開されます。"
